# =============================================================
#  Configuration de l'éditeur (Sveltia CMS)
# =============================================================
# Maman se connecte sur /admin/ avec GitHub, ajoute ses photos,
# puis clique « Publish ». Tout se publie en direct sur le site.
#
# ⚠️  AVANT que ça fonctionne, Shawn doit faire UNE seule fois la
#     configuration décrite dans admin/SETUP.md (créer une « GitHub
#     OAuth App » + déployer le petit serveur de connexion gratuit),
#     puis remplacer l'adresse "base_url" ci-dessous.
# =============================================================

backend:
  name: github
  repo: MrKillerVortex/kreation-kf
  branch: main
  # Serveur de connexion (worker Cloudflare de Shawn)
  base_url: https://sveltia-cms-auth.shawn-2002.workers.dev

# Dossier où sont enregistrées les photos téléversées
media_folder: "images"
public_folder: "/images"

# Langue de l'interface
locale: fr

collections:
  - name: "galerie"
    label: "🎨 Galerie de Maman"
    label_singular: "œuvre"
    description: "Ajoutez vos nouvelles créations ici."
    files:
      - name: "oeuvres"
        label: "Mes œuvres"
        file: "data/oeuvres.json"
        description: "Cliquez sur « Add Mes œuvres » pour ajouter une création."
        fields:
          - label: "Œuvres"
            label_singular: "œuvre"
            name: "oeuvres"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Photo", name: "img", widget: "image" }
              - { label: "Titre", name: "title", widget: "string", hint: "Le nom de l'œuvre" }
              - { label: "Description", name: "desc", widget: "string", hint: "Une courte phrase (ex : Toile géode bleue et or)" }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                default: "mur"
                options:
                  - { label: "Toiles & Murales", value: "mur" }
                  - { label: "Planches & Verres", value: "bain" }
                  - { label: "Horloges & Décos", value: "deco" }

      # --- VIDÉOS dans la galerie (portfolio) ---
      - name: "videos-portfolio"
        label: "🎬 Mes vidéos (galerie)"
        file: "data/videos-portfolio.json"
        description: "Ajoutez de courtes vidéos qui apparaîtront dans la galerie, parmi vos œuvres."
        fields:
          - label: "Vidéos"
            label_singular: "vidéo"
            name: "videos"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Vidéo (fichier .mp4)", name: "video", widget: "file", media_folder: "/videos", public_folder: "/videos", hint: "Courte vidéo. ⚠️ Gardez-la légère (moins de ~20 Mo)." }
              - { label: "Image de couverture (optionnel)", name: "poster", widget: "image", required: false, hint: "L'image affichée avant que la vidéo démarre." }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "string", required: false }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                default: "mur"
                options:
                  - { label: "Toiles & Murales", value: "mur" }
                  - { label: "Planches & Verres", value: "bain" }
                  - { label: "Horloges & Décos", value: "deco" }

  # --- COULISSES / ATELIER (vidéos uniquement) ---
  - name: "coulisses"
    label: "🎥 Coulisses / Atelier"
    label_singular: "vidéo"
    description: "Vidéos des coulisses : vous au travail dans l'atelier."
    files:
      - name: "videos-coulisses"
        label: "Mes vidéos d'atelier"
        file: "data/coulisses.json"
        description: "Cliquez sur « Add Vidéos » pour ajouter une vidéo des coulisses."
        fields:
          - label: "Vidéos"
            label_singular: "vidéo"
            name: "videos"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Vidéo (fichier .mp4)", name: "video", widget: "file", media_folder: "/videos", public_folder: "/videos", hint: "Courte vidéo. ⚠️ Gardez-la légère (moins de ~20 Mo)." }
              - { label: "Image de couverture (optionnel)", name: "poster", widget: "image", required: false }
              - { label: "Titre", name: "title", widget: "string", required: false }
              - { label: "Description", name: "desc", widget: "string", required: false }

  # --- ŒUVRES À VENDRE (photos + prix) ---
  - name: "a-vendre"
    label: "💰 À vendre"
    label_singular: "œuvre à vendre"
    description: "Ajoutez ici les œuvres disponibles à l'achat, avec leur prix."
    files:
      - name: "oeuvres-a-vendre"
        label: "Mes œuvres à vendre"
        file: "data/a-vendre.json"
        description: "Cliquez sur « Add Mes œuvres à vendre » pour mettre une œuvre en vente."
        fields:
          - label: "Œuvres à vendre"
            label_singular: "œuvre"
            name: "oeuvres"
            widget: "list"
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - { label: "Photo", name: "img", widget: "image" }
              - { label: "Titre", name: "title", widget: "string", hint: "Le nom de l'œuvre" }
              - { label: "Description", name: "desc", widget: "string", required: false, hint: "Dimensions, matériaux, etc. (facultatif)" }
              - { label: "Prix", name: "price", widget: "string", hint: "Ex : 250 $  — ou écrivez « Prix sur demande »" }
